server {
    listen 80;
    listen [::]:80;
    server_name api.adccure.nl;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.adccure.nl;

    ssl_certificate /etc/letsencrypt/live/api.adccure.nl/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.adccure.nl/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    client_max_body_size 32m;
    error_page 413 = @payload_too_large;
    proxy_connect_timeout 10s;
    proxy_read_timeout 180s;
    proxy_send_timeout 180s;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization $http_authorization;

    location = /health {
        proxy_pass http://192.168.1.190:8007/health;
    }

    location = / {
        limit_except POST {
            deny all;
        }
        proxy_pass http://192.168.1.190:8007;
    }

    location / {
        return 404;
    }

    location @payload_too_large {
        default_type application/json;
        return 413 '{"error":{"status":413,"message":"Audio upload exceeds 32 MiB"}}';
    }
}
